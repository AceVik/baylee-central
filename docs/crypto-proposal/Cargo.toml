[workspace]
resolver = "3"

[package]
name = "central-crypto-proposal"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "placeholder.rs"

[dependencies]
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255", "argon2"] }
sha2 = { version = "=0.10.9", default-features = false }
rand = { version = "=0.8.8", default-features = false, features = ["getrandom"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = { version = "=0.12.4", default-features = false }
zeroize = { version = "=1.9.1", features = ["alloc", "derive"] }
secrecy = "=0.10.3"
getrandom = "=0.4.3"
