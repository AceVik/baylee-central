[package]
name = "central-migration"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Explicit versioned PostgreSQL migrations for Baylee Central"

[lints]
workspace = true

[dependencies]
# The runner is first-party (src/lib.rs); SeaORM only connects and executes.
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
