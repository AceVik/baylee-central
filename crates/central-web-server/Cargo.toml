[package]
name = "central-web-server"
version = "0.1.0"
description = "baylee.app's web server: renders the pages, serves the assets, reads public data"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "central-web"
path = "src/main.rs"

[dependencies]
central-api = { path = "../central-api", version = "=0.1.0" }
central-web = { path = "../central-web", version = "=0.1.0" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["timeout"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }

[lints]
workspace = true
