[package]
name = "central-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Local-development HTTP boundary for Baylee Central"

[lints]
workspace = true

[dependencies]
central-policy = { path = "../central-policy", version = "=0.1.0" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["service", "tokio"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.6.8", default-features = false, features = ["timeout"] }

http-body-util = "=0.1.5"
