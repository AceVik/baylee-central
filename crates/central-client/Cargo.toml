[package]
name = "central-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Transport-independent native login and encrypted account synchronization SDK"

[lints]
workspace = true

[dependencies]
central-api = { path = "../central-api", version = "=0.1.0" }
central-crypto = { path = "../central-crypto", version = "=0.1.0" }
zeroize = { version = "=1.9.1", features = ["alloc", "derive"] }

[dev-dependencies]
central-policy = { path = "../central-policy", version = "=0.1.0" }
central-http = { path = "../central-http", version = "=0.1.0" }
central-identity = { path = "../central-identity", version = "=0.1.0" }
central-postgres = { path = "../central-postgres", version = "=0.1.0" }
central-migration = { path = "../central-migration", version = "=0.1.0" }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

