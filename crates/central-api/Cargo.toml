[package]
name = "central-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# AGPL, not the workspace licence: the Baylee client links this crate (LICENSE.md § 6).
license = "AGPL-3.0-only"
