[package]
name = "central-service"
version = "0.1.1-beta.9b"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Thin executable for Baylee Central: local development and deployed operation"

[lints]
workspace = true

[dependencies]
central-api = { path = "../central-api", version = "=0.1.0" }
central-crypto = { path = "../central-crypto", version = "=0.1.0", features = ["server"] }
central-identity = { path = "../central-identity", version = "=0.1.0" }
central-postgres = { path = "../central-postgres", version = "=0.1.0" }
central-migration = { path = "../central-migration", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = { version = "=1.9.1", features = ["alloc", "derive"] }
central-policy = { path = "../central-policy", version = "=0.1.0" }
central-http = { path = "../central-http", version = "=0.1.0" }
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
