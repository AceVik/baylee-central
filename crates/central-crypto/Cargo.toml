[package]
name = "central-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# AGPL, not the workspace licence: the Baylee client links this crate (LICENSE.md § 6).
license = "AGPL-3.0-only"
description = "Experimental native-client OPAQUE and master-key wrapping, and the legacy store's Argon2id check; not a deployed protocol"

[features]
default = []
server = []

[lints]
workspace = true

[dependencies]
opaque-ke = { version = "=4.0.1", default-features = false, features = ["ristretto255"] }
# The fixed OPAQUE KSF and legacy verifier use the current Argon2 implementation
# with caller-owned, wiped memory; protocol parameters remain unchanged.
argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# opaque-ke 4's TripleDh requires digest 0.10. Keep this compatibility type
# separate from the current SHA implementation used by vaults and chat.
opaque-sha2 = { package = "sha2", version = "=0.10.9", default-features = false }
rand = { version = "=0.8.8", default-features = false, features = ["getrandom"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
zeroize = { version = "=1.9.1", features = ["alloc", "derive"] }
secrecy = "=0.10.3"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
# The pairing's HMACs (`pairing.rs`), the same release `hkdf` builds on.
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
# The pairing's seal (`pairing.rs`): RFC 9180 HPKE for one suite only, the
# owner's choice of 30.10.2026 (docs/dependency-proposal/hpke.md).
hpke = { version = "=0.15.1", default-features = false, features = ["x25519", "chacha", "alloc"] }

# Native chat compatibility: owner approved the Ed25519 packages and curve digest
# feature on 2026-11-02 (docs/dependency-proposal/chat.md).
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }

[dev-dependencies]
# OPAQUE's previous Argon2 integration is an independent compatibility oracle.
opaque-ke = { version = "=4.0.1", default-features = false, features = ["argon2"] }
rand_chacha = { version = "=0.10.0", default-features = false, features = ["std"] }
