[package]
name = "central-push"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Bounded standards-based Web Push delivery without private message content"
[lints]
workspace = true
[dependencies]
central-api = { path = "../central-api", version = "=0.1.0" }
ece = { version = "=2.4.2", default-features = false, features = ["backend-openssl"] }
jsonwebtoken = { version = "=11.1.0", default-features = false }
jsonwebtoken-openssl = "=2.0.0"
openssl = { version = "=0.10.82", default-features = false, features = ["aws-lc"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
base64ct = { version = "=1.8.3", features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = { version = "=1.9.1", features = ["alloc"] }
