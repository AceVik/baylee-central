[package]
name = "central-picture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Profile pictures: the picture worker's protocol, its client, and the checks the service makes of its answer"

[lints]
