[package]
name = "central-funding"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "The donation platforms' answers and Ko-fi's deliveries read strictly, the reference rates and the sums; no transport of its own"

[lints]
workspace = true

# No transport and no database: the service asks the platforms through
# central-outbound and stores through central-postgres; this crate only
# reads what comes back, within bounds, and adds up.
[dependencies]
central-api = { path = "../central-api", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The ECB's daily reference rates are XML. Safe Rust (forbid(unsafe_code)),
# no DTD, a bounded document: docs/security-assurance.md, "Donations".
roxmltree = { version = "=0.21.2", default-features = false, features = ["std"] }
form_urlencoded = "=1.2.3"
sha2 = { version = "=0.11.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
