[package]
name = "central-web-islands"
version = "0.1.0"
description = "baylee.app's islands as WebAssembly: the public module, and with `admin` the administration's (cargo xtask site builds both)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
central-web = { path = "../central-web", version = "=0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.9.0-rc1", default-features = false, features = ["islands", "hydrate"] }
wasm-bindgen = { version = "=0.2.130", default-features = false, features = ["std"] }

[features]
# The administration's module: the islands of `/{lang}/account/admin…`
# besides the public ones (central-web's `admin`).
admin = ["central-web/admin"]

[lints]
workspace = true
