name: foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The server (central-service and its crates) runs in production on Linux
  # x86-64 alone, so only ubuntu-24.04 builds and tests it, release build and
  # development smoke included (owner, 29.10.2026). Windows and both macOS
  # architectures check what the Baylee desktop client links from here
  # (central-api, central-client and their workspace dependencies, read from
  # `cargo metadata`), with the policy and the tasks: `cargo xtask gate
  # --client` (docs/xtask.md). The matrix and job name stay as they were:
  # branch protection requires `verify (<os>)` for all four.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # bash on every runner, Windows' Git Bash included: the checks are
    # `cargo xtask` tasks (crates/xtask, docs/xtask.md), not shell scripts.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      # nasm: rav1e's and rav1d's x86-64 assembly in the picture worker's
      # codecs (docs/dependency-proposal/profile-picture.md, owner 12.11.2026).
      - name: Native Web Push crypto and picture codec build tools
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev cmake nasm
      - name: Policy, tests, lint and release build
        if: matrix.os == 'ubuntu-24.04'
        run: cargo xtask gate
      - name: Policy, tests and lint of the client's crates
        if: matrix.os != 'ubuntu-24.04'
        run: cargo xtask gate --client
      - name: Verify development lifecycle and failure cleanup
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cargo xtask smoke
          # The deliberate failure must fail, and only for its own reason,
          # after its cleanup.
          set +e
          failure=$(cargo xtask smoke --exercise-failure 2>&1 >/dev/null)
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$failure" != "Synthetic development failure" ]; then
            echo "Expected development failure did not occur: $failure"
            exit 1
          fi
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo fetch --locked
      - name: Verify the exact scope of the bigint advisory exception
        run: cargo xtask crypto-scope
      - name: Verify that libsqlite3-sys is in no build (RUSTSEC-2026-0459)
        run: cargo xtask sqlite-scope
      - run: cargo audit --deny warnings
      - run: cargo deny check

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Scan source and history with pinned Gitleaks, and its self-test
        run: cargo xtask secrets

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Real PostgreSQL migrations, roles, TLS and UUIDv7
        run: cargo xtask postgres
      - name: Fixture cleanup after failure
        run: |
          set +e
          failure=$(cargo xtask postgres --exercise-failure 2>&1 >/dev/null)
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$failure" != "Synthetic fixture failure" ]; then
            echo "Expected fixture failure did not occur"
            exit 1
          fi

  # The website's browser crypto (crates/central-web/crypto/README.md): the
  # committed WebAssembly module and glue must be what the source builds,
  # byte for byte, here on Linux whatever machine built them.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - name: Rebuild central-web-crypto and compare with crates/central-web/crypto
        run: cargo xtask wasm --check

  # The browser test suites' own checks (web/README.md): the typecheck and the
  # lint of the Playwright suites. The suites themselves run in the site job.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  # The server-rendered site (docs/proposals/frontend-rewrite.md): the
  # islands linted for the browser's target, the assets built as a deployment
  # builds them, then every page in a real browser: axe-core (WCAG 2.2 AA) in
  # both colour schemes, 44 px targets, no sideways scrolling from 320 to
  # 2560 px, no request to another origin, keyboard paths and the islands.
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown --component clippy
      # `cargo xtask site` reads the whole locked graph offline for the
      # third-party notices; this job builds only a part of it.
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Clippy for the browser's half
        run: cargo clippy --locked -p central-web -p central-web-islands --target wasm32-unknown-unknown --lib -- -D warnings
      # the administration's module (`admin`) in a run of its own: in one
      # run the features would meet, and the public module go unlinted
      - name: Clippy for the administration's module
        run: cargo clippy --locked -p central-web -p central-web-islands --target wasm32-unknown-unknown --lib --all-features -- -D warnings
      - run: cargo build --locked -p central-web-server
      - run: cargo xtask site
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e:site
        working-directory: web
