name: foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Policy, tests, lint and release build
        run: ./scripts/test.ps1
      - name: Policy in Rust (cargo xtask)
        run: |
          cargo xtask policy --compiler-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify development lifecycle and failure cleanup
        run: |
          ./scripts/smoke-dev.ps1
          $before = Get-Location
          try {
            ./scripts/smoke-dev.ps1 -ExerciseFailure
            throw 'Expected development failure did not occur'
          } catch {
            if ($_.Exception.Message -ne 'Synthetic development failure') { throw }
          }
          if ((Get-Location).Path -ne $before.Path) { throw 'Smoke cleanup changed caller location' }
      - name: Development smoke in Rust (cargo xtask)
        run: |
          cargo xtask smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # each stderr line arrives as an ErrorRecord; "$_" is its text
          $failure = ((cargo xtask smoke --exercise-failure 2>&1) | ForEach-Object { "$_" }) -join "`n"
          if ($LASTEXITCODE -eq 0 -or $failure -cne 'Synthetic development failure') {
            throw 'Expected development failure did not occur'
          }
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit --deny warnings
      - run: cargo deny check

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan source with pinned Gitleaks
        shell: pwsh
        run: ./scripts/scan-secrets.ps1
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Scan source in Rust (cargo xtask)
        run: cargo xtask secrets

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Real PostgreSQL migrations, roles and UUIDv7
        shell: pwsh
        run: ./scripts/test-postgres.ps1
      - name: Verify fixture cleanup after failure
        shell: pwsh
        run: |
          try {
            ./scripts/test-postgres.ps1 -ExerciseFailure
            throw 'Expected fixture failure did not occur'
          } catch {
            if ($_.Exception.Message -ne 'Synthetic fixture failure') { throw }
          }
          exit 0
      - name: Real PostgreSQL in Rust (cargo xtask)
        run: cargo xtask postgres
      - name: Fixture cleanup after failure in Rust (cargo xtask)
        run: |
          set +e
          failure=$(cargo xtask postgres --exercise-failure 2>&1 >/dev/null)
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$failure" != "Synthetic fixture failure" ]; then
            echo "Expected fixture failure did not occur"
            exit 1
          fi

  # The web app (web/README.md): typecheck, lint, unit tests, build, then the
  # Playwright smoke tests against the build at a phone's and a desktop's
  # width. Every outside service is mocked in the browser (web/e2e/mocks.ts).
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
