[graph]
all-features = true

[advisories]
# Bound by cargo xtask crypto-scope in the gate and dependency job.
# See docs/crypto-proposal/bigint-advisory.md for the unreachable arithmetic.
# RUSTSEC-2024-0436: paste 1.0.15 is unmaintained; a compile-time proc macro
# of Leptos (owner, 10.11.2026, docs/dependency-proposal/leptos.md). Remove
# when Leptos drops it.
ignore = [
  "RUSTSEC-2026-0387",
  { id = "RUSTSEC-2024-0436", reason = "paste: Leptos' compile-time proc macro, owner-accepted 10.11.2026; remove when Leptos drops it" },
]
unmaintained = "all"
unsound = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Only these exact reviewed versions are excluded from duplicate detection.
# OPAQUE/Argon2 and current AEAD use different RustCrypto trait generations.
skip = [
  { name = "argon2", version = "=0.5.3", reason = "OPAQUE's previous KSF is a test-only compatibility oracle for Argon2 0.6" },
  { name = "blake2", version = "=0.10.6", reason = "test-only Argon2 0.5 oracle vs runtime Argon2 0.6" },
  { name = "base64", version = "=0.22.1", reason = "ECE/JWT base64 API vs ureq 3.5" },
  { name = "signature", version = "=2.2.0", reason = "JWT provider trait vs Ed25519 signature 3" },
  { name = "shlex", version = "=1.3.0", reason = "bindgen 0.72 parser vs cc build adapter" },
  { name = "itertools", version = "=0.13.0", reason = "bindgen 0.72 adapter vs workspace tools" },
  # OPAQUE and SQLx use incompatible maintained crypto/RNG API generations.
  { name = "digest", version = "=0.10.7", reason = "OPAQUE digest API vs SQLx 0.9" },
  { name = "hkdf", version = "=0.12.4", reason = "OPAQUE HKDF API vs SQLx 0.9" },
  { name = "hmac", version = "=0.12.1", reason = "OPAQUE HMAC API vs SQLx 0.9" },
  { name = "sha2", version = "=0.10.9", reason = "OPAQUE SHA2 API vs SQLx 0.9" },
  { name = "rand", version = "=0.8.8", reason = "OPAQUE RNG traits vs SQLx 0.9" },
  { name = "rand_core", version = "=0.6.4", reason = "OPAQUE RNG traits vs SQLx 0.9" },
  { name = "hashbrown", version = "=0.16.1", reason = "SQLx hashlink vs SeaORM indexmap" },
  { name = "heck", version = "=0.4.1", reason = "SeaQuery derive vs SeaORM macro generation" },
  { name = "windows-sys", version = "=0.52.0", reason = "ring native adapter vs current Tokio" },
  { name = "block-buffer", version = "=0.10.4", reason = "OPAQUE digest 0.10 vs cipher 0.5 API generations" },
  { name = "crypto-common", version = "=0.1.7", reason = "OPAQUE digest 0.10 vs AEAD 0.6 API generations" },
  { name = "cpufeatures", version = "=0.2.17", reason = "OPAQUE/Dalek/SHA2 vs ChaCha20/Poly1305 generation" },
  { name = "getrandom", version = "=0.2.17", reason = "OPAQUE rand 0.8 trait compatibility; application uses 0.4" },
  { name = "syn", version = "=2.0.119", reason = "Dalek/zeroize proc macros still require syn 2" },
  { name = "curve25519-dalek", version = "=4.1.3", reason = "OPAQUE (opaque-ke 4) vs the pairing's HPKE X25519 (x25519-dalek 3); no shared types" },
  { name = "fiat-crypto", version = "=0.2.9", reason = "curve25519-dalek 4.1.3's fiat backend; built by neither (cfg never set)" },
  # Leptos (docs/dependency-proposal/leptos.md, owner 10.11.2026).
  { name = "convert_case", version = "=0.6.0", reason = "Leptos' config crate vs leptos_macro's convert_case 0.12" },
  { name = "itertools", version = "=0.14.0", reason = "SeaORM 2 vs Leptos 0.9's leptos_macro (itertools 0.15)" },
  { name = "prettyplease", version = "=0.3.0", reason = "leptos_macro (syn 3) vs bindgen 0.72's prettyplease 0.2" },
  { name = "proc-macro2-diagnostics", version = "=0.11.0", reason = "Leptos' rstml (syn 3) vs the workspace's 0.10" },
]

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "ISC", "Zlib", "CDLA-Permissive-2.0"]

[[licenses.exceptions]]
name = "ece"
version = "=2.4.2"
allow = ["MPL-2.0"]

# Leptos' dependencies (owner, 10.11.2026, docs/dependency-proposal/leptos.md).
[[licenses.exceptions]]
name = "xxhash-rust"
version = "=0.8.19"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "base16"
version = "=0.2.1"
allow = ["CC0-1.0"]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
