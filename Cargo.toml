[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
overflow-checks = true
strip = "debuginfo"

[profile.dev]
overflow-checks = true

# `cargo xtask` (.cargo/config.toml): its own directory under target.
[profile.xtask]
inherits = "dev"
