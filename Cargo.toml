[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
overflow-checks = true
strip = "debuginfo"

[profile.dev]
overflow-checks = true

# Argon2 (64 MiB, three passes) unoptimised makes every OPAQUE test take
# seconds; its hashing optimised keeps the suite short. Checks stay on.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# `cargo xtask` (.cargo/config.toml): its own directory under target.
[profile.xtask]
inherits = "dev"

# `cargo xtask wasm` (docs/xtask.md): central-web-crypto's WebAssembly module,
# one codegen unit and link-time optimisation, so the build is small and the
# same on every machine.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
