[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false
license = "LicenseRef-Baylee-Central-Source-Available-1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
overflow-checks = true
strip = "debuginfo"

[profile.dev]
overflow-checks = true

# Argon2 (64 MiB, three passes) unoptimised makes every OPAQUE test take
# seconds; its hashing optimised keeps the suite short. Checks stay on.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# The real signature-flood integration exercises a one-second verification
# budget. Unoptimised curve arithmetic on CI can take longer than that window
# to make the requests themselves. Keep the production limits and assertions;
# optimise the same vetted signature arithmetic, with overflow checks retained.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3

# The picture worker's codecs (docs/profile-pictures.md) unoptimised take
# seconds per AVIF and per hostile file in the tests; optimised, the suite
# and its mutation loops stay short. Checks stay on.
[profile.dev.package.rav1e]
opt-level = 3
[profile.dev.package.rav1d]
opt-level = 3
[profile.dev.package.ravif]
opt-level = 3
[profile.dev.package.avif-decode]
opt-level = 3
[profile.dev.package.yuv]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.central-picture-codec]
opt-level = 3

# `cargo xtask` (.cargo/config.toml): its own directory under target.
[profile.xtask]
inherits = "dev"

# `cargo xtask wasm` (docs/xtask.md): central-web-crypto's WebAssembly module,
# one codegen unit and link-time optimisation, so the build is small and the
# same on every machine.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"

# `cargo xtask site` (docs/xtask.md): the website's islands, optimised for
# size, since every interactive page downloads them.
[profile.islands]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
